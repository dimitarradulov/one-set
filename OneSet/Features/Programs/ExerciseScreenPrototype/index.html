<!doctype html>
<!-- THROWAWAY: Three exercise detail variants for Q3, selected with ?variant=A|B|C.
     Run from repo root: python3 -m http.server 8765 --bind 127.0.0.1
     Open /OneSet/Features/Programs/ExerciseScreenPrototype/ . No production app changes.
     All personal results are fictional layout fixtures. Calculation policy is undecided. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSet · Exercise screen prototype</title>
<style>
@font-face{font-family:Montserrat;src:url('/OneSet/DesignSystem/Fonts/Montserrat-Regular.ttf')}@font-face{font-family:Montserrat;src:url('/OneSet/DesignSystem/Fonts/Montserrat-Medium.ttf');font-weight:500}@font-face{font-family:Bebas;src:url('/OneSet/DesignSystem/Fonts/BebasNeue-Regular.ttf')}
:root{color-scheme:dark;--bg:#1a1a1a;--surface:#222;--raised:#2a2a2a;--line:#3a3a3a;--text:#e5e5e5;--muted:#a3a3a3;--orange:#d97706}*{box-sizing:border-box}body{margin:0;background:#101010;color:var(--text);font:14px/1.5 Montserrat,system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}button{min-height:44px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Bebas,sans-serif;font-weight:400;line-height:1.12}h1{font-size:36px}h2{font-size:27px}h3{font-size:23px}small,.caption{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.workbench{display:flex;justify-content:center;align-items:flex-start;gap:64px;padding:40px 28px 130px}.brief{width:280px;position:sticky;top:40px}.brand{font-family:Bebas;font-size:28px}.tag{display:block;color:var(--orange);font-size:12px;margin:24px 0 10px}.brief h2{font-size:36px}.brief p{margin-top:16px;color:var(--muted);line-height:1.7}.controls{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}.controls label{display:block;margin-bottom:8px}.controls select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}.state{margin-top:24px;font-size:12px;color:var(--muted)}.state dl{margin:8px 0}.state dt{margin-top:8px;color:var(--text)}.state dd{margin:0}.phone{width:393px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:36px;overflow:hidden;box-shadow:0 20px 70px #0005}.status{display:flex;justify-content:space-between;padding:15px 24px 8px;font:500 13px Montserrat}.nav{padding:2px 16px 8px}.back{border:0;background:none;padding:0;display:flex;align-items:center;gap:8px;font-size:14px}.chevron{font:28px/1 system-ui}.content{padding:8px 20px 32px}.heading .caption{margin-bottom:8px}.heading{margin-bottom:20px}.video{aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:12px}.video svg{width:28px;height:28px;stroke:var(--muted);fill:none;stroke-width:1.5}.video span{font-size:12px;color:var(--muted)}.prescription{padding:16px 0;margin-top:4px}.prescription .topline{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.prescription strong{font-size:16px;font-weight:500}.prescription .caption{margin-top:4px}.guidance{border-bottom:1px solid var(--line);margin-bottom:28px}details{border-top:1px solid var(--line)}summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:20px;color:var(--muted)}details[open]>summary:after{content:'−'}details p{padding:0 0 16px;color:var(--muted);font-size:13px;line-height:1.65}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.scope{font-size:12px;color:var(--muted);margin-bottom:16px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;background:var(--surface);border-radius:12px}.stat .label{font-size:12px;color:var(--muted);min-height:36px}.value{font-size:26px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}.value span{font-size:13px;color:var(--muted);font-weight:400}.stat .caption{margin-top:8px;font-size:11px}.latest{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:var(--surface);border-radius:12px}.latest .result{font-size:18px;font-weight:500;margin:4px 0}.history{margin-top:28px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.history-row .date{font-size:13px;margin-bottom:3px}.history-row .result{font-size:16px;font-weight:500;white-space:nowrap}.history-row .caption{font-size:11px}.history-row .result small{display:block;text-align:right;font-size:12px;font-weight:400;margin-top:3px}.estimate-note{margin-top:16px;font-size:11px;line-height:1.65;color:var(--muted)}.record-row{border-bottom:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.record-row .value{font-size:24px;text-align:right;white-space:nowrap}.record-row .caption{font-size:11px;margin-top:4px}.record-label{font-size:13px}.ledger-latest{border-left:2px solid var(--orange);padding-left:14px;margin-top:24px}.ledger-latest .value{margin:8px 0;font-size:28px}.ledger-latest .caption{font-size:11px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:24px;margin-top:20px;margin-bottom:20px}.tabs button{border:0;background:none;padding:8px 0 12px;color:var(--muted)}.tabs button[aria-selected=true]{border-bottom:2px solid var(--orange);color:var(--text)}.record-hero{padding:8px 0 20px;border-bottom:1px solid var(--line)}.record-hero .value{font-size:48px;margin:10px 0}.record-hero .value span{font-size:20px}.record-secondary{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.record-secondary .value{font-size:24px;margin:6px 0}.record-secondary .caption{font-size:11px}.empty{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.empty p{color:var(--muted);font-size:12px;margin-top:8px}.empty-values{display:flex;gap:24px;margin-top:16px}.empty-values span{font-size:26px;display:block}.empty-values small{font-size:12px}.home{height:5px;width:130px;border-radius:4px;background:var(--text);margin:0 auto 10px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#eee;color:#161616;border-radius:99px;box-shadow:0 6px 32px #0009;padding:4px;z-index:5;white-space:nowrap}.switcher button{border:none;background:none;color:#161616;width:48px;border-radius:50%;font-size:22px}.switcher button:hover{background:#d6d6d6}.switcher .name{font-size:12px;min-width:190px;text-align:center;padding:0 8px}.prototype-label{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#101010ec;padding:4px 12px;border-radius:20px;color:#bbb;font-size:12px;white-space:nowrap}.preview-row{border:0;border-bottom:1px solid var(--line);background:none;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:18px 0}.preview-row strong{font-weight:500}.preview-row .caption{display:block;margin-top:4px}.preview-info{margin:20px 0;background:var(--surface);padding:16px;border-radius:12px;font-size:13px}.preview-num{color:var(--muted);font-size:12px;margin-right:14px}
@media(max-width:760px){.workbench{padding:0 0 145px;display:block}.brief{position:static;width:auto;padding:20px}.brief .brand,.brief .tag,.brief h2,.brief>p,.state{display:none}.controls{margin:0;padding:0;border:0;display:flex;align-items:center;gap:12px}.controls label{font-size:12px;margin:0;flex-shrink:0}.controls select{padding:8px;min-height:44px}.phone{width:100%;max-width:430px;margin:auto;border:0;border-radius:0;box-shadow:none}.status{display:none}.prototype-label{bottom:80px}.switcher{bottom:20px}.home{display:none}}
</style>
<body>
<div class="workbench">
 <aside class="brief"><div class="brand">ONESET</div><span class="tag">EXERCISE SCREEN · Q3</span><h2 id="variant-title"></h2><p id="variant-description"></p>
 <div class="controls"><label for="data-state">Personal results</label><select id="data-state"><option value="sample">Sample history</option><option value="empty">No recorded sets yet</option></select></div>
 <p>Fictional results for layout review. The first app version will show the empty state.</p>
 <div class="state"><strong>Prototype state</strong><dl id="state"></dl></div></aside>
 <main class="phone" aria-label="Exercise screen preview"><div class="status"><span>9:41</span><span aria-label="Full battery">●●● ▰</span></div><div id="screen"></div><div class="home"></div></main>
</div>
<div class="prototype-label">THROWAWAY PROTOTYPE · SAMPLE DATA</div>
<nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><span class="name" id="variant-name" aria-live="polite"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants={A:{name:'At a glance',description:'Two compact record tiles, the latest set, then dated history. Everything is available in one scroll.'},B:{name:'The logbook',description:'Records in simple rows, a distinct latest-set entry, then the log. Less framing, more space for context.'},C:{name:'Records / History',description:'A focused record view with heaviest weight as the main statistic. Switch to History for the dated results; exercise guidance stays above both.'}};
const params=new URLSearchParams(location.search);let variant=variants[params.get('variant')]?params.get('variant'):'C';let empty=params.get('data')==='empty';let section='records';let page='exercise';
const results=[['12 Oct 2026','Machine Full Body · Workout A','80 kg × 8','Most recent'],['5 Oct 2026','Machine Full Body · Workout A','80 kg × 7',''],['28 Sep 2026','Upper / Lower · Upper','90 kg × 2','Heaviest weight'],['21 Sep 2026','Upper / Lower · Upper','75 kg × 10','']];
const video=()=>`<div class="video"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="7" width="15" height="14" rx="3"/><path d="m18 11 7-3v12l-7-3"/></svg><p>Exercise video coming soon</p><span>Technique instructions are available below</span></div>`;
const guidance=()=>`${variant==='C'?'':`<section class="prescription" aria-label="Workout prescription"><div class="topline"><strong>1 working set · 6–10 reps</strong><span class="caption">Rest 3 min</span></div><div class="caption">For Machine Full Body · Workout A</div></section>`}<section class="guidance" style="${variant==='C'?'margin-top:24px':''}" aria-label="Exercise guidance"><details><summary>Technique & stopping point</summary><p>Adjust the seat so the handles start around mid-chest. Keep your back supported and press through a controlled, comfortable range without bouncing.</p><p>Momentary muscular failure: continue until another full repetition cannot be completed through the prescribed range of motion with controlled technique.</p></details><details><summary>Warmup guidance</summary><p>For the first heavy movement pattern in a workout, use about 40–50% of working load for 6–8 reps, 65–70% for 3–5 reps, and 80–85% for 1–3 reps when the working load is heavy. Later exercises need only the preparation required to feel technically ready. Do not take warm-up sets to failure.</p></details></section>`;
const note=()=>`<p class="estimate-note">Estimated one-rep max is calculated from a recorded set. It is an estimate, not a tested single-rep lift.</p>`;
const emptyMessage=()=>`<div class="empty"><strong>No recorded sets yet</strong><p>Your records and past results will appear here after you log this exercise.</p></div>`;
const history=()=>`<section class="history"><div class="section-head"><h2>Past results</h2><span class="caption">Newest first</span></div>${empty?emptyMessage():results.map(r=>`<div class="history-row"><div><div class="date">${r[0]}</div><div class="caption">${r[1]}</div></div><div class="result">${r[2]}${r[3]?`<small>${r[3]}</small>`:''}</div></div>`).join('')}</section>`;
function VariantA(){return `<section><h2>Your performance</h2><p class="scope">Machine Chest Press · All programs</p><div class="stats-grid"><div class="stat"><div class="label">Heaviest weight</div><div class="value">${empty?'—':'90 <span>kg</span>'}</div><div class="caption">${empty?'No recorded sets':'2 reps · 28 Sep 2026'}</div></div><div class="stat"><div class="label">Estimated one-rep max</div><div class="value">${empty?'—':'101.3 <span>kg</span>'}</div><div class="caption">${empty?'No estimate yet':'From 80 kg × 8'}</div></div></div><div class="latest"><div><div class="caption">Most recent result</div><div class="result">${empty?'—':'80 kg × 8 reps'}</div><div class="caption">${empty?'No recorded sets yet':'12 Oct 2026 · Workout A'}</div></div></div>${note()}${empty?emptyMessage():''}</section>${history()}`}
function VariantB(){return `<section><h2>Your records</h2><p class="scope">Machine Chest Press · All programs</p><div class="record-row"><div><div class="record-label">Heaviest weight</div><div class="caption">${empty?'No recorded sets':'28 Sep 2026 · 2 reps'}</div></div><div class="value">${empty?'—':'90 <span>kg</span>'}</div></div><div class="record-row"><div><div class="record-label">Estimated one-rep max</div><div class="caption">${empty?'No estimate yet':'From 80 kg × 8 · 12 Oct'}</div></div><div class="value">${empty?'—':'101.3 <span>kg</span>'}</div></div>${note()}<div class="ledger-latest"><span class="caption">Most recent result</span><div class="value">${empty?'—':'80 <span>kg ×</span> 8 <span>reps</span>'}</div><p class="caption">${empty?'No recorded sets yet':'12 Oct 2026 · Machine Full Body · Workout A'}</p></div>${empty?emptyMessage():''}</section>${history()}`}
function VariantC(){return `<section><h2>Your performance</h2><p class="scope">Machine Chest Press · All programs</p><div class="tabs" role="tablist" aria-label="Performance view"><button role="tab" aria-selected="${section==='records'}" data-section="records">Records</button><button role="tab" aria-selected="${section==='history'}" data-section="history">History</button></div><div role="tabpanel" aria-label="${section==='records'?'Records':'History'}">${section==='history'?history():`<div class="record-hero"><p class="muted">Heaviest weight</p><div class="value">${empty?'—':'90 <span>kg</span>'}</div><p class="caption">${empty?'No recorded sets':'2 reps · 28 Sep 2026'}</p></div><div class="record-secondary"><div><div class="caption">Estimated one-rep max</div><div class="value">${empty?'—':'101.3 <span>kg</span>'}</div><div class="caption">${empty?'No estimate yet':'From 80 kg × 8'}</div></div><div><div class="caption">Most recent result</div><div class="value">${empty?'—':'80 <span>kg ×</span> 8'}</div><div class="caption">${empty?'No recorded sets':'12 Oct · Workout A'}</div></div></div>${note()}${empty?emptyMessage():''}`}</div></section>`}
function preview(){return `<div class="nav"><button class="back" id="return"><span class="chevron">‹</span> Exercise</button></div><div class="content"><div class="heading"><div class="caption">Day 1</div><h1>Workout A</h1><p class="muted">Machine Full Body</p></div><div class="preview-info">Read-only template preview</div><h2>Exercise order and rep targets</h2>${[['01','Hack Squat Machine','6–10 reps'],['02','Machine Chest Press','6–10 reps'],['03','Neutral-Grip Lat Pulldown','8–12 reps']].map(r=>`<button class="preview-row" data-exercise="${r[0]}"><span><span class="preview-num">${r[0]}</span><strong>${r[1]}</strong><span class="caption">${r[2]}</span></span><span class="chevron">›</span></button>`).join('')}<p class="caption" style="margin-top:20px">Prototype: Machine Chest Press is the interactive row.</p></div>`}
function render(){const v=variants[variant];params.set('variant',variant);params.set('data',empty?'empty':'sample');window.history.replaceState({},'',`${location.pathname}?${params}`);document.querySelector('#variant-title').textContent=v.name;document.querySelector('#variant-description').textContent=v.description;document.querySelector('#variant-name').textContent=`${variant} / 3 · ${v.name}`;document.querySelector('#data-state').value=empty?'empty':'sample';document.querySelector('.prototype-label').textContent=`THROWAWAY PROTOTYPE · ${empty?'EMPTY STATE':'SAMPLE DATA'}`;document.querySelector('#state').innerHTML=`<dt>Variant</dt><dd>${variant} · ${v.name}</dd><dt>Data</dt><dd>${empty?'Empty — first release':'Fictional completed sets'}</dd><dt>Scope</dt><dd>Same exercise across all programs</dd><dt>View</dt><dd>${page==='preview'?'Workout preview':variant==='C'?section:'Records + history'}</dd><dt>Video</dt><dd>Static placeholder</dd>`;document.querySelector('#screen').innerHTML=page==='preview'?preview():`<div class="nav"><button class="back" id="back"><span class="chevron">‹</span> Workout A</button></div><div class="content"><header class="heading">${variant==='C'?'':'<div class="caption">Machine Full Body · Day 1</div>'}<h1>Machine Chest Press</h1></header>${video()}${guidance()}${({A:VariantA,B:VariantB,C:VariantC}[variant])()}</div>`;document.querySelector('#back')?.addEventListener('click',()=>{page='preview';render();window.scrollTo(0,0)});document.querySelector('#return')?.addEventListener('click',()=>{page='exercise';render()});document.querySelector('[data-exercise="02"]')?.addEventListener('click',()=>{page='exercise';render()});document.querySelectorAll('[data-exercise]:not([data-exercise="02"])').forEach(el=>{el.disabled=true;el.style.cursor='default'});document.querySelectorAll('[data-section]').forEach(el=>el.addEventListener('click',()=>{const y=scrollY;section=el.dataset.section;render();window.scrollTo(0,y)}))}
function cycle(direction){const keys=Object.keys(variants);variant=keys[(keys.indexOf(variant)+direction+3)%3];page='exercise';section='records';render()}
document.querySelector('#previous').addEventListener('click',()=>cycle(-1));document.querySelector('#next').addEventListener('click',()=>cycle(1));document.querySelector('#data-state').addEventListener('change',e=>{empty=e.target.value==='empty';render()});document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script>
</body></html>
