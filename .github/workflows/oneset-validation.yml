name: OneSet validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: oneset-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: OneSet validation
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install SwiftLint 0.65.1
        run: |
          curl -L --fail --silent --show-error https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  '"$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: npm ci --prefix worker
      - run: ./scripts/validate.sh --ci
        env:
          ONESET_ARTIFACTS_DIR: ${{ runner.temp }}/oneset-artifacts
      - name: Upload simulator test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: oneset-simulator-results
          path: ${{ runner.temp }}/oneset-artifacts/validation/
          retention-days: 7
