name: OneSet validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: oneset-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install SwiftLint 0.65.1
        run: |
          curl -L --fail --silent --show-error https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  '"$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: ./scripts/validate.sh --lint

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix worker
      - run: ./scripts/validate.sh --worker

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix worker
      - run: ./scripts/validate.sh --dashboard
        env:
          DASHBOARD_CHROME_BIN: /usr/bin/google-chrome

  ios:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run iOS tests
        run: ./scripts/validate.sh "$IOS_TEST_SCOPE"
        timeout-minutes: 55
        env:
          IOS_TEST_SCOPE: ${{ github.event_name == 'pull_request' && '--ios-pr' || '--ios-ci' }}
          ONESET_ARTIFACTS_DIR: ${{ runner.temp }}/oneset-artifacts
      - name: Upload simulator test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: oneset-simulator-results
          path: ${{ runner.temp }}/oneset-artifacts/validation/
          retention-days: 7

  validate:
    name: OneSet validation
    needs: [lint, worker, dashboard, ios]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        env:
          ALL_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_PASSED" = true
