included:
  - OneSet
  - OneSetTests
  - OneSetUITests

excluded:
  - .build
  - DerivedData
  - Pods

baseline: .swiftlint-baseline.json

disabled_rules:
  - line_length
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicit_return
  - orphaned_doc_comment
  - prefer_zero_over_explicit_init
  - toggle_bool
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate

force_unwrapping: warning
function_body_length:
  warning: 60
  error: 100
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 1000
  error: 1000
