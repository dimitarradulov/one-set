    stopping_guidance: Momentary muscular failure — continue until another full repetition cannot be completed through the prescribed range with controlled technique.
    warmup_guidance: For the first heavy movement pattern in a workout, use about 40–50% of working load for 6–8 reps, 65–70% for 3–5 reps, and 80–85% for 1–3 reps when the working load is heavy. Later exercises need only the preparation required to feel technically ready. Do not take warm-up sets to failure.
