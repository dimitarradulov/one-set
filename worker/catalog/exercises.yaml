exercises:
  - key: 45-degree-back-extension
    name: "45-Degree Back Extension"
    instructions: "Lower the weight under control, use a comfortable full range, and lift without bouncing."
    stopping_guidance: "Stop when you cannot complete another rep without losing position or changing your form."
    warmup_guidance: "For the first heavy exercise in a workout, use warm-up sets at about 40–50% of your working weight for 6–8 reps, 65–70% for 3–5 reps, and 80–85% for 1–3 reps. Skip any stage that feels unnecessary. For later exercises, warm up only if needed. Do not take warm-up sets to failure."
    rest_seconds: 120
    default_reps: { minimum: 8, maximum: 12 }
