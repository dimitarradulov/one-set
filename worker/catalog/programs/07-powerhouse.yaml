key: powerhouse
name: Powerhouse
format: Torso + Arms / Thighs + Posterior Chain / Upper Back + Shoulder Girdle
emphasis: A dense, powerful wrestler-like build - thick torso, substantial upper back, strong shoulder girdle,
  muscular arms and forearms, heavy thighs and posterior chain, with developed neck and traps.
