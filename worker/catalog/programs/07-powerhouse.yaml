    name: Torso Density + Arms
    banner: upper-body
    position: 1
    exercises:
      - key: powerhouse-day-1-torso-density-arms-smith-machine-barbell-row
        reps:
          maximum: 10
          minimum: 6
        exercise: smith-machine-barbell-row
        position: 1
      - key: powerhouse-day-1-torso-density-arms-weighted-dip
        reps:
          maximum: 10
          minimum: 6
        exercise: weighted-dip
        position: 2
