key: machine-full-body
name: Machine Full Body
recommended_weeks: 8
format: "A / B / C"
emphasis: "Lifters who want maximum stability, simple progression, and a low-skill environment for high-effort training."
workouts:
  - key: machine-full-body-workout-a
    name: Workout A
    position: 1
    exercises:
      - key: machine-full-body-workout-a-hack-squat-machine
        exercise: hack-squat-machine
        position: 1
        reps: { minimum: 6, maximum: 10 }
      - key: machine-full-body-workout-a-machine-chest-press
        exercise: machine-chest-press
        position: 2
        reps: { minimum: 6, maximum: 10 }
      - key: machine-full-body-workout-a-neutral-grip-lat-pulldown
        exercise: neutral-grip-lat-pulldown
        position: 3
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-a-seated-leg-curl
        exercise: seated-leg-curl
        position: 4
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-a-machine-lateral-raise
        exercise: machine-lateral-raise
        position: 5
        reps: { minimum: 12, maximum: 20 }
      - key: machine-full-body-workout-a-machine-preacher-curl
        exercise: machine-preacher-curl
        position: 6
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-a-cable-triceps-pressdown
        exercise: cable-triceps-pressdown
        position: 7
        reps: { minimum: 8, maximum: 12 }
  - key: machine-full-body-workout-b
    name: Workout B
    position: 2
    exercises:
      - key: machine-full-body-workout-b-leg-press
        exercise: leg-press
        position: 1
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-b-chest-supported-machine-row
        exercise: chest-supported-machine-row
        position: 2
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-b-incline-machine-chest-press
        exercise: incline-machine-chest-press
        position: 3
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-b-lying-leg-curl
        exercise: lying-leg-curl
        position: 4
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-b-reverse-pec-deck
        exercise: reverse-pec-deck
        position: 5
        reps: { minimum: 12, maximum: 20 }
      - key: machine-full-body-workout-b-cable-curl
        exercise: cable-curl
        position: 6
        reps: { minimum: 10, maximum: 15 }
      - key: machine-full-body-workout-b-overhead-cable-triceps-extension
        exercise: overhead-cable-triceps-extension
        position: 7
        reps: { minimum: 10, maximum: 15 }
  - key: machine-full-body-workout-c
    name: Workout C
    position: 3
    exercises:
      - key: machine-full-body-workout-c-leg-extension
        exercise: leg-extension
        position: 1
        reps: { minimum: 10, maximum: 15 }
      - key: machine-full-body-workout-c-machine-shoulder-press
        exercise: machine-shoulder-press
        position: 2
        reps: { minimum: 6, maximum: 10 }
      - key: machine-full-body-workout-c-wide-grip-lat-pulldown
        exercise: wide-grip-lat-pulldown
        position: 3
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-c-seated-leg-curl
        exercise: seated-leg-curl
        position: 4
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-c-pec-deck
        exercise: pec-deck
        position: 5
        reps: { minimum: 10, maximum: 15 }
      - key: machine-full-body-workout-c-machine-lateral-raise
        exercise: machine-lateral-raise
        position: 6
        reps: { minimum: 12, maximum: 20 }
      - key: machine-full-body-workout-c-machine-preacher-curl
        exercise: machine-preacher-curl
        position: 7
        reps: { minimum: 8, maximum: 12 }
      - key: machine-full-body-workout-c-cable-triceps-pressdown
        exercise: cable-triceps-pressdown
        position: 8
        reps: { minimum: 8, maximum: 12 }
