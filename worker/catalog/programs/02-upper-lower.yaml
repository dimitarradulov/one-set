key: upper-lower
name: Upper / Lower
format: Upper A / Lower A / Upper B / Lower B
emphasis: Lifters who prefer shorter sessions and want more recovery between upper- and lower-body work.
workouts:
  - key: upper-lower-upper-a
    name: Upper A
    banner: upper-body
    position: 1
    exercises:
      - key: upper-lower-upper-a-weighted-chin-up
        reps:
          maximum: 10
          minimum: 6
        exercise: weighted-chin-up
        position: 1
      - key: upper-lower-upper-a-incline-smith-machine-press
        reps:
          maximum: 10
          minimum: 6
        exercise: incline-smith-machine-press
        position: 2
      - key: upper-lower-upper-a-chest-supported-machine-row
        reps:
          maximum: 12
          minimum: 8
        exercise: chest-supported-machine-row
        position: 3
      - key: upper-lower-upper-a-machine-lateral-raise
        reps:
          maximum: 20
          minimum: 12
        exercise: machine-lateral-raise
        position: 4
      - key: upper-lower-upper-a-barbell-curl
        reps:
          maximum: 10
          minimum: 6
        exercise: barbell-curl
        position: 5
      - key: upper-lower-upper-a-cable-triceps-pressdown
        reps:
          maximum: 12
          minimum: 8
        exercise: cable-triceps-pressdown
        position: 6
  - key: upper-lower-lower-a
    name: Lower A
    banner: lower-body
    position: 2
    exercises:
      - key: upper-lower-lower-a-hack-squat-machine
        reps:
          maximum: 10
          minimum: 6
        exercise: hack-squat-machine
        position: 1
      - key: upper-lower-lower-a-romanian-deadlift
        reps:
          maximum: 10
          minimum: 6
        exercise: romanian-deadlift
        position: 2
      - key: upper-lower-lower-a-leg-extension
        reps:
          maximum: 15
          minimum: 10
        exercise: leg-extension
        position: 3
      - key: upper-lower-lower-a-seated-leg-curl
        reps:
          maximum: 12
          minimum: 8
        exercise: seated-leg-curl
        position: 4
      - key: upper-lower-lower-a-cable-crunch
        reps:
          maximum: 15
          minimum: 10
        exercise: cable-crunch
        position: 5
  - key: upper-lower-upper-b
    name: Upper B
    banner: upper-body
    position: 3
    exercises:
      - key: upper-lower-upper-b-weighted-dip
        reps:
          maximum: 10
          minimum: 6
        exercise: weighted-dip
        position: 1
      - key: upper-lower-upper-b-smith-machine-barbell-row
        reps:
          maximum: 10
          minimum: 6
        exercise: smith-machine-barbell-row
        position: 2
      - key: upper-lower-upper-b-machine-shoulder-press
        reps:
          maximum: 10
          minimum: 6
        exercise: machine-shoulder-press
        position: 3
      - key: upper-lower-upper-b-neutral-grip-lat-pulldown
        reps:
          maximum: 12
          minimum: 8
        exercise: neutral-grip-lat-pulldown
        position: 4
      - key: upper-lower-upper-b-incline-dumbbell-curl
        reps:
          maximum: 12
          minimum: 8
        exercise: incline-dumbbell-curl
        position: 5
      - key: upper-lower-upper-b-overhead-cable-triceps-extension
        reps:
          maximum: 15
          minimum: 10
        exercise: overhead-cable-triceps-extension
        position: 6
  - key: upper-lower-lower-b
    name: Lower B
    banner: lower-body
    position: 4
    exercises:
      - key: upper-lower-lower-b-leg-press
        reps:
          maximum: 12
          minimum: 8
        exercise: leg-press
        position: 1
      - key: upper-lower-lower-b-45-degree-back-extension
        reps:
          maximum: 12
          minimum: 8
        exercise: 45-degree-back-extension
        position: 2
      - key: upper-lower-lower-b-bulgarian-split-squat
        reps:
          maximum: 12
          minimum: 8
        scope: each_leg
        exercise: bulgarian-split-squat
        position: 3
      - key: upper-lower-lower-b-lying-leg-curl
        reps:
          maximum: 12
          minimum: 8
        exercise: lying-leg-curl
        position: 4
      - key: upper-lower-lower-b-hanging-knee-raise
        reps:
          maximum: 15
          minimum: 10
        exercise: hanging-knee-raise
        position: 5
recommended_weeks: 8
